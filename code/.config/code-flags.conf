# Flags for /usr/bin/code (visual-studio-code-bin), which strips comments from
# this file and passes the rest on the command line. One flag per line.
#
# VS Code is Electron, running native Wayland through the
# ELECTRON_OZONE_PLATFORM_HINT set in hyprland.lua. Chromium reads none of the
# input-method env vars, so fcitx5 (pinyin, mozc) cannot reach it without this.
# Same flag as chrome-flags.conf. If typing works only in the first window, add
# --wayland-text-input-version=3 on its own line.
--enable-wayland-ime
