# User config for spotify-launcher. Read in preference to
# /etc/spotify-launcher.conf, which ships these same options commented out.
#
# Spotify's client is CEF, not Electron, so the ELECTRON_OZONE_PLATFORM_HINT
# set in hyprland.lua does not reach it and it starts on Xwayland. At the 1.5
# monitor scale the compositor can only bitmap-upscale an Xwayland surface,
# which is why the UI and album art look soft. These two arguments make it a
# native Wayland client that scales properly.
#
# Note this pins it to Wayland with no X11 fallback, unlike Chrome's
# --ozone-platform-hint=auto. spotify-launcher is only ever run from this
# desktop session, so that is fine; drop the arguments if that changes.
#
# Verify what actually gets passed with:
#     spotify-launcher -v --skip-update --no-exec
[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland"]
