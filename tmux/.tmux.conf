unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-s

set -g mouse on

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

# set -g @catppuccin_flavor "mocha"
#
# "basic" draws square separators; "rounded" drew half-circle caps, which is
# the one thing the rest of this desktop no longer does anywhere.
set -g @catppuccin_window_status_style "basic"

# Ember palette (see ~/.config/hypr/ember.conf). catppuccin/tmux v2 sets its
# own colours with `set -ogq`, which does not overwrite an option that already
# exists -- so these must come BEFORE the `run tpm` line at the bottom, and
# whichever @thm_* are defined here win over the flavor's values.
set -g @thm_bg "#262126"
set -g @thm_mantle "#1e1a1e"
set -g @thm_crust "#161215"

set -g @thm_surface_0 "#322c31"
set -g @thm_surface_1 "#3f373c"
set -g @thm_surface_2 "#4d4248"
set -g @thm_overlay_0 "#6b5d61"
set -g @thm_overlay_1 "#8a7a7c"
set -g @thm_overlay_2 "#a08e8f"

set -g @thm_fg "#ede0dc"
set -g @thm_subtext_0 "#c9b6b3"
set -g @thm_subtext_1 "#d5c4c0"

set -g @thm_red "#f96b69"
set -g @thm_maroon "#d4525a"
set -g @thm_peach "#e8a04a"
set -g @thm_yellow "#f5c06a"
set -g @thm_green "#a3b57a"
set -g @thm_teal "#7fb0a8"
set -g @thm_sky "#9ccdc4"
set -g @thm_sapphire "#8fb3c4"
set -g @thm_blue "#a8b6d4"
set -g @thm_lavender "#c9b6b3"
set -g @thm_mauve "#c77ba0"
set -g @thm_pink "#dd97b8"
set -g @thm_flamingo "#ffb0a3"
set -g @thm_rosewater "#ede0dc"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g status-style bg=default
