"$schema" = "https://starship.rs/config-schema.json"

format = """
[](surface0)\
$os\
$username\
[](bg:surface2 fg:surface0)\
$directory\
[](fg:surface2 bg:surface1)\
$git_branch\
$git_status\
[](fg:surface1 bg:surface2)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:surface2 bg:surface1)\
$docker_context\
[](fg:surface1 bg:surface2)\
$time\
[ ](fg:surface2)\
$line_break$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
# Muted grayscale mapping (keep names, tone down colors)
rosewater = "#F2F2F2"
flamingo  = "#E6E6E6"
pink      = "#DADADA"
orange    = "#CFCFCF"
red       = "#BFBFBF"
maroon    = "#AFAFAF"
peach     = "#9F9F9F"
yellow    = "#8F8F8F"
green     = "#7F7F7F"
teal      = "#707070"
sky       = "#626262"
sapphire  = "#555555"
blue      = "#494949"
lavender  = "#3E3E3E"

# Text & surfaces (high contrast white text on dark surfaces)
text      = "#FFFFFF"
subtext1  = "#D0D0D0"
subtext0  = "#B8B8B8"
overlay2  = "#9E9E9E"
overlay1  = "#878787"
overlay0  = "#757575"
surface2  = "#3A3A3A"  # darkest segment border
surface1  = "#2E2E2E"  # mid segment
surface0  = "#242424"  # left pill
base      = "#181818"  # prompt background reference (kept)
mantle    = "#121212"
crust     = "#0C0C0C"

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:text"
format = "[ $user ]($style)"

[directory]
style = "fg:text bg:surface2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:surface1"
format = '[[ $symbol $branch ](fg:text bg:surface1)]($style)'

[git_status]
style = "bg:surface1"
format = '[[($all_status$ahead_behind )](fg:text bg:surface1)]($style)'

[nodejs]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[c]
symbol = " "
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[rust]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[golang]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[php]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[java]
symbol = " "
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[kotlin]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[haskell]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[python]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:text bg:surface2)]($style)'

[docker_context]
symbol = ""
style = "bg:surface1"
format = '[[ $symbol( $context) ](fg:text bg:surface1)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface2"
format = '[[  $time ](fg:text bg:surface2)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[](bold fg:lavender)"   # subtle gray-white
error_symbol   = "[](bold fg:rosewater)"  # lighter gray for contrast
vimcmd_symbol  = "[](bold fg:flamingo)"
vimcmd_replace_one_symbol = "[](bold fg:pink)"
vimcmd_replace_symbol     = "[](bold fg:pink)"
vimcmd_visual_symbol      = "[](bold fg:orange)"
