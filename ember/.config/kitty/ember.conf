# vim:ft=kitty

## name:  Ember
## blurb: Sampled from ~/wallpaper/wallpaper.png -- red sun over dark water.

# The Catppuccin Mocha theme this replaced is still in the repository at
# ~/.config/kitty/current-theme.conf. kitty.conf decides which one is included.

# The basic colors
foreground              #ede0dc
background              #262126
selection_foreground    #262126
selection_background    #f96b69

# Cursor colors
cursor                  #f96b69
cursor_text_color       #262126

# URL underline color when hovering with mouse
url_color               #e8a04a

# Kitty window border colors
active_border_color     #f96b69
inactive_border_color   #4d4248
bell_border_color       #e8a04a

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #161215
active_tab_background   #f96b69
inactive_tab_foreground #c9b6b3
inactive_tab_background #322c31
tab_bar_background      #1e1a1e

# Colors for marks (marked text in the terminal)
mark1_foreground #262126
mark1_background #f96b69
mark2_foreground #262126
mark2_background #e8a04a
mark3_foreground #262126
mark3_background #ded0c4

# The 16 terminal colors.
#
# Programs expect green to look green and blue to look blue, so the six hues
# are all still distinguishable -- they are just desaturated and warmed until
# they sit inside the wallpaper's range instead of fighting it. Red is the
# exception and is left at full strength, because it is the accent.

# black
color0 #322c31
color8 #4d4248

# red
color1 #f96b69
color9 #ff8b7e

# green
color2  #a3b57a
color10 #bccb95

# yellow
color3  #e8a04a
color11 #f5c06a

# blue
color4  #8d9dbd
color12 #a8b6d4

# magenta
color5  #c77ba0
color13 #dd97b8

# cyan
color6  #7fb0a8
color14 #9ccdc4

# white
color7  #c9b6b3
color15 #ede0dc
