# Ember -- the palette this machine is themed in.
#
# Every colour here was sampled from ~/wallpaper/wallpaper.png rather than
# picked by eye, so the desktop and the wallpaper agree instead of merely
# coexisting. The sun disc is #f96b69, its reflection on the water is #d4525a,
# the sky is #322e32 and the sea is #3b363a; the darker greys below are those
# two extended downwards, and the text tones are warm rather than blue-grey so
# nothing on screen reads as cold next to the wallpaper.
#
# This is the hyprlang half. The same palette exists as GTK CSS in
# ~/.config/waybar/ember.css and ~/.config/wofi/ember.css, and as terminal
# colours in ~/.config/kitty/ember.conf. Change a value here and change it
# there too -- there is no single source the four formats can share.
#
# The Catppuccin Mocha files this replaced are still in the repository
# (hyprmocha, waybar/mocha.css, kitty/current-theme.conf). Reverting is a
# matter of pointing the consumers back at them.

# Backgrounds, darkest first.
$crust = rgb(161215)
$crustAlpha = 161215

$mantle = rgb(1e1a1e)
$mantleAlpha = 1e1a1e

$base = rgb(262126)
$baseAlpha = 262126

$surface0 = rgb(322c31)
$surface0Alpha = 322c31

$surface1 = rgb(3f373c)
$surface1Alpha = 3f373c

$surface2 = rgb(4d4248)
$surface2Alpha = 4d4248

# Dimmed foregrounds, for anything that is off, muted or inactive.
$overlay0 = rgb(6b5d61)
$overlay0Alpha = 6b5d61

$overlay1 = rgb(8a7a7c)
$overlay1Alpha = 8a7a7c

$subtext = rgb(c9b6b3)
$subtextAlpha = c9b6b3

$text = rgb(ede0dc)
$textAlpha = ede0dc

# The accent, straight off the sun disc, and two steps down into the water.
$ember = rgb(f96b69)
$emberAlpha = f96b69

$ember2 = rgb(d4525a)
$ember2Alpha = d4525a

$ember3 = rgb(a83a44)
$ember3Alpha = a83a44

# The band where the sun meets the sea. Dark enough to sit under text.
$horizon = rgb(482b2c)
$horizonAlpha = 482b2c

# Second accent. Red alone cannot signal two different things at once, so
# warnings and capslock use this instead of another shade of the first.
$amber = rgb(e8a04a)
$amberAlpha = e8a04a

$bone = rgb(ded0c4)
$boneAlpha = ded0c4
