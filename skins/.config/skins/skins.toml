# Skins -- the single source every themed surface is generated from.
#
# Before this file existed the palette was maintained as four hand-synced
# copies (~/.config/hypr/ember.conf, ~/.config/waybar/ember.css,
# ~/.config/wofi/ember.css, ~/.config/kitty/ember.conf), and the header
# comment in each one said so: "Change a value here and change it there too --
# there is no single source the four formats can share." That was tolerable
# for one palette. It is not tolerable for eight, so `skinctl` now renders all
# of the formats from the tokens below.
#
# The token names come from the Retro RPG launcher design handoff. Every
# surface in that design reads the same sixteen colours, so the same sixteen
# are all this file defines. Do not add a token here without also teaching
# skinctl what to do with it.
#
#   bg       desktop / the void behind the frame
#   shadow   outer 5px halo and hard drop shadow; darker than everything else
#   window   window fill behind the grid
#   outer    frame rule, title tab fill, big numerals
#   inner    cell and panel rules, dividers, EMPTY METER BLOCKS
#   cell     cell and inset fill
#   strip    detail strip / secondary panel fill
#   text     primary text
#   body     body copy
#   dim      tags, key hints, inactive
#   accent   cursor glyph, active selector, filled meters
#   outline  selection outline around the highlighted cell
#   cmd      category hue -- Terminal
#   net      category hue -- Browser
#   txt      category hue -- Editor
#   snd      category hue -- Music
#
# The one hard constraint, from the handoff: `inner` is the empty-meter track,
# so it must stay clearly darker than every colour that fills a meter (accent,
# outer, text and the four category hues) or a half-full bar stops reading as
# half full. `skinctl lint` checks this.
#
# Order matters. The launcher binds number keys to skins by position, so the
# nth entry below is key n. Ember is first because it is the machine's own
# palette and the default.

# Battery and peripheral health only. These are deliberately skin-independent:
# a warning that changes colour with the theme is not a warning. The POWER OFF
# button in the control center also uses `critical`.
[thresholds]
ok       = "#3ddc84"
warn     = "#ffc53d"
critical = "#ff4a1f"

# Status-condition chip hues, also skin-independent (creature-shell handoff):
# SLP is suspend, BRN is thermal throttling, PAR is latency/packet loss.
slp      = "#7cb8ff"
brn      = "#ff7a3c"
par      = "#ffd36b"

# Behaviour defaults. A skin overrides these in its own [skins.behavior]
# table; only Dream Land does.
[defaults]
glyph      = "▶"
radius     = "0px"
blink      = "1s"
shine      = "none"
menu_word  = "LAUNCH"
empty_word = "EMPTY"


# ---------------------------------------------------------------------------
# EMBER -- this machine's own palette, kept as the default skin.
#
# Every value here was sampled from ~/wallpaper/wallpaper.png rather than
# picked by eye, so the desktop and the wallpaper agree instead of merely
# coexisting. The sun disc is #f96b69, its reflection on the water is #d4525a,
# the sky is #322e32 and the sea is #3b363a.
#
# Mapping the old sixteen Ember names onto the sixteen design tokens is not
# one-to-one, so two things needed deciding:
#
#   - `shadow` had no Ember equivalent. It is crust taken two steps darker.
#   - Ember is a two-hue palette (red and amber) and the design wants four
#     distinguishable category hues. The assignment below is the least-bad
#     one available without inventing colours the wallpaper does not contain,
#     and it is the single place where Ember reads weaker than the seven
#     designed skins. Fix by picking four real hues if it bothers you.
#
# The [skins.legacy] block at the bottom pins the old names to their exact
# current values, so switching to this skin reproduces today's desktop
# byte-for-byte rather than approximately.
[[skins]]
slug    = "ember"
name    = "EMBER"
bg      = "#262126"
shadow  = "#0b090a"
window  = "#322c31"
outer   = "#f96b69"
inner   = "#482b2c"
cell    = "#1e1a1e"
strip   = "#161215"
text    = "#ede0dc"
body    = "#c9b6b3"
dim     = "#8a7a7c"
accent  = "#e8a04a"
outline = "#f96b69"
cmd     = "#e8a04a"
net     = "#c9b6b3"
txt     = "#ded0c4"
snd     = "#f96b69"

# Verbatim from the retired ember.conf / ember.css pair. Without these the
# derivation in skinctl would produce close-but-not-equal greys and the bar
# would visibly shift the first time a skin was applied.
[skins.legacy]
crust    = "#161215"
mantle   = "#1e1a1e"
base     = "#262126"
surface0 = "#322c31"
surface1 = "#3f373c"
surface2 = "#4d4248"
overlay0 = "#6b5d61"
overlay1 = "#8a7a7c"
subtext  = "#c9b6b3"
text     = "#ede0dc"
ember    = "#f96b69"
ember2   = "#d4525a"
ember3   = "#a83a44"
horizon  = "#482b2c"
amber    = "#e8a04a"
bone     = "#ded0c4"


