# Skins -- the single source every themed surface is generated from.
#
# `skinctl` renders the tokens below into every format that consumes them
# (Hyprland, hyprlock, kitty, GTK, starship, the greeting, and skin.json for
# the shell). Nothing downstream carries a colour of its own; a QML file
# with a hex in it is a bug. Edit here, then `skinctl generate` (or `skinctl
# set <slug>`), and `skinctl lint` checks the rules at the bottom.
#
# The fifteen tokens, and what each is FOR. The purpose is the contract:
# every surface uses a token for its listed job and nothing else, so the
# same colour means the same thing everywhere.
#
#   bg       surface fill: the void behind the desk, the lock scrim, every
#            framed panel
#   shadow   the darkest strip -- the bar's own fill
#   window   the focused-row fill under a snd focus ring
#   outer    the frame accent: kitty's active border and tab
#   inner    borders, dividers, rules, and the EMPTY METER TRACK
#   cell     rows, panels, titlebar strips
#   strip    a second panel fill (kitty's inactive tab, GTK header bars)
#   text     primary text, figures
#   body     body copy, default icon colour
#   dim      muted labels, key hints, inactive
#   accent   the caret, FILLED METERS, ON-state chips, toggle-ON text
#   cmd      category hue -- Terminal
#   net      category hue -- Browser
#   txt      category hue -- Editor
#   snd      category hue -- Music, AND the one focus / selection colour
#
# Rules `skinctl lint` checks: `inner` is the empty-meter track, so it must
# stay clearly darker than every colour that fills a meter (accent, outer,
# text and the four category hues) or a half-full bar stops reading as half
# full; and `shadow` must not be lighter than `bg`.
#
# Order matters. The launcher binds number keys to skins by position, so the
# nth entry below is key n, and the first entry is the default when no skin
# has been chosen. There is one skin today: DREAM LAND, the machine's daily
# palette. The 2026-08 prune cut the roster from eleven to four, and the
# 2026-09-06 costume removal cut the three creature skins; all of them live
# in git history and on the archive/dream-land-mascot tag.

# Battery and peripheral health only. These are deliberately skin-independent:
# a warning that changes colour with the theme is not a warning. The POWER OFF
# button in the control center also uses `critical`.
[thresholds]
ok       = "#3ddc84"
warn     = "#ffc53d"
critical = "#ff4a1f"

# Behaviour defaults. A skin overrides these in its own [skins.behavior]
# table.
#
#   glyph       the launcher's cursor character
#   radius      corner radius ("0px" is the Console look)
#   blink       caret blink period
#   bar         which screen edge the bar sits on
#   font_label  the label face (small caps labels, figures, titlebars)
#   font_body   the body face (sentence-case copy)
[defaults]
glyph      = ">"
radius     = "0px"
blink      = "1s"
bar        = "top"
font_label = "IBM Plex Mono"
font_body  = "IBM Plex Mono"


# ---------------------------------------------------------------------------
# DREAM LAND -- the default. The Kirby night-sky palette under the Console
# dress (2026-08-24 redesign): IBM Plex Mono everywhere, square corners, 2px
# rules, stroke icons. The colours are the flavour; the chrome is the
# terminal's.

[[skins]]
slug    = "dream-land"
name    = "DREAM LAND"
bg      = "#0d0a26"
shadow  = "#05030f"
window  = "#241a5c"
outer   = "#ff5fa2"
inner   = "#2a2170"
cell    = "#17123f"
strip   = "#17123f"
text    = "#f4eaff"
body    = "#cbb6f0"
dim     = "#8a76c4"
accent  = "#ffcf7a"
cmd     = "#7de3c8"
net     = "#6aa8ff"
txt     = "#ffb26b"
snd     = "#ff86d0"
