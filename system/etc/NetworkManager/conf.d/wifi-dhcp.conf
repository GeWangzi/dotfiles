# Never tear down an activated connection because a DHCP renewal went
# unanswered. On WinGates the mesh steers this laptop between nodes shortly
# after every connect, and the steered-to node (0e:fe:7b:e4:a7:0a) sometimes
# eats DHCP for a while right after the handoff. NetworkManager restarts DHCP
# on every iwd roam; with the default 45s timeout an unanswered restart is
# fatal ('ip-config-unavailable') and the whole link is destroyed -- that was
# the 2026-08-22 "wifi dead, rebooted" incident. With an infinite timeout NM
# keeps the existing lease and retries quietly until the node heals or we roam
# back, so a router-side DHCP hiccup is a stall instead of an outage.
#
# 2147483647 is NM's spelling of "infinity" in a conf.d file.
[connection]
ipv4.dhcp-timeout=2147483647
ipv6.dhcp-timeout=2147483647
