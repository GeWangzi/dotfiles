; For devices where a 'Internal Mic' or 'Internal Mic Boost' element exists
; 'Int Mic' and 'Int Mic Boost' are for compatibility with kernels < 2.6.38
;
; See analog-output.conf.common for an explanation on the directives

[General]
priority = 89
description-key = analog-input-microphone-internal

[Jack Mic]
state.plugged = no
state.unplugged = unknown

[Jack Dock Mic]
state.plugged = no
state.unplugged = unknown

[Jack Front Mic]
state.plugged = no
state.unplugged = unknown

[Jack Rear Mic]
state.plugged = no
state.unplugged = unknown

[Jack Internal Mic Phantom]
state.plugged = unknown
state.unplugged = unknown
required-any = any

[Element Capture]
switch = mute
volume = 50
override-map.1 = all
override-map.2 = all-left,all-right

[Element Internal Mic Boost]
required-any = any
switch = select
volume = 1
override-map.1 = all
override-map.2 = all-left,all-right

[Option Internal Mic Boost:on]
name = input-boost-on

[Option Internal Mic Boost:off]
name = input-boost-off

[Element Int Mic Boost]
required-any = any
switch = select
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Option Int Mic Boost:on]
name = input-boost-on

[Option Int Mic Boost:off]
name = input-boost-off

[Element Internal Mic]
required-any = any
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Int Mic]
required-any = any
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Input Source]
enumeration = select

[Option Input Source:Internal Mic]
name = analog-input-microphone-internal
required-any = any

[Option Input Source:Int Mic]
name = analog-input-microphone-internal
required-any = any

[Element Capture Source]
enumeration = select

[Option Capture Source:Internal Mic]
name = analog-input-microphone-internal
required-any = any

[Option Capture Source:Int Mic]
name = analog-input-microphone-internal
required-any = any

[Element Mic]
switch = off
volume = off

[Element Dock Mic]
switch = off
volume = off

[Element Front Mic]
switch = off
volume = off

[Element Rear Mic]
switch = off
volume = off

[Element Headphone Mic]
switch = off
volume = off

[Element Headphone Mic Boost]
switch = off
volume = off

[Element Mic Boost]
switch = off
volume = off

[Element Dock Mic Boost]
switch = off
volume = off

[Element Front Mic Boost]
switch = off
volume = off

[Element Rear Mic Boost]
switch = off
volume = off

.include /usr/share/alsa-card-profile/mixer/paths/analog-input-mic.conf.common
