# Override of the stock ACP path for the ALC285 internal mic, copied from
# pipewire 1.6.9 (/usr/share/alsa-card-profile/mixer/paths/). Re-diff against
# the stock file if a pipewire upgrade changes it.
#
# Pins both analog stages at the values tuned by ear and confirmed on calls:
#   Capture            50  (20.25 dB; stock merges it into the volume slider, 63 max)
#   Internal Mic Boost  1  (10 dB; 3 is 30 dB)
# With no merged volume element left, ACP does input volume in software for
# this route only, so no app or WirePlumber restore can drive the hardware to
# maximum, and the gain no longer depends on /var/lib/alsa/asound.state.
#
# The include is absolute because relative includes resolve against this
# file's directory, which is no longer /usr/share.

