# hyprsunset -- blue-light filter. Profiles apply at the given local time and
# stay until the next profile's time. Times are local (Asia/Shanghai).
#
# Lower temperature = warmer/more orange. 6000K is neutral daylight, which is
# what the panel does untouched. Adjust the times and values to taste; reload
# with `systemctl --user restart hyprsunset`.

# Daytime: no color change at all. `identity` is cheaper than setting 6000K
# because it skips the color matrix entirely.
profile {
    time = 7:00
    identity = true
}

# Evening: mild warmth, still comfortable for color-sensitive work.
profile {
    time = 19:00
    temperature = 4500
}

# Late night: stronger, plus a slight gamma drop so the panel is less harsh
# in a dark room.
profile {
    time = 22:00
    temperature = 3800
    gamma = 90
}
