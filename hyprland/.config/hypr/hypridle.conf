general {
  # The lock screen lives in the Quickshell shell now (Lock.qml, handoff
  # turn 13a). If the shell is not running, fall back to hyprlock -- a lock
  # command that can fail silently is not a lock command.
  lock_cmd = qs ipc call lock lock || pidof hyprlock || hyprlock
}

listener {
  timeout = 300
  on-timeout = loginctl lock-session
  # on-resume = notify-send "resume"
}

# Blank the panel a minute after locking. Without this the backlight stays on
# indefinitely behind the lock screen, which on battery is the single biggest
# avoidable draw after the SoC.
#
# Deliberately no suspend listener here -- dpms only. dpms just powers the
# output off and on and never touches the ext-session-lock state, so it does
# not go near the hyprlock-after-suspend failure that `fixlock` exists for.
# Add suspend later only after this has proven itself.
listener {
  timeout = 360
  # Lua config means `hyprctl dispatch` takes Lua, not the old bare-word form:
  # `hyprctl dispatch dpms off` fails with "')' expected near 'off'".
  on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
  on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
