# ############################################################################
# RESCUE CONFIG -- this is NOT the real config.
#
# The live configuration is hyprland.lua. Hyprland only reads this file when
# hyprland.lua is absent, i.e. after `restore-lua.sh --conf` disabled the Lua
# config from a TTY.
#
# Keep this file deliberately minimal. Its only job is to give a usable
# session -- a terminal, a launcher, a way to move between windows and a way
# out -- so the Lua config can be repaired. Do not mirror hyprland.lua here;
# a second full config only drifts and misleads.
#
# Recovery from a TTY (Ctrl+Alt+F2):
#     ~/.config/hypr/restore-lua.sh          restore the pristine Lua config
#     ~/.config/hypr/restore-lua.sh --conf   disable Lua, land on this file
# ############################################################################

# Internal panel. 1.5 scale corrects the 157 DPI panel against the 96 DPI that
# toolkits assume; 60Hz keeps the iGPU load down. Matches hyprland.lua.
monitor = eDP-1,1920x1080@60,0x0,1.5
# Catch-all for any external display.
monitor = ,preferred,auto,1

# 24 is the standard base size. The 1.5 monitor scale does the DPI correction,
# so this must not be hand-inflated the way it was before the Lua migration.
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

$terminal = kitty
$menu = wofi --show drun

general {
    gaps_in = 5
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(181825ff)
    layout = dwindle
}

decoration {
    rounding = 10
    # Blur and shadows stay off here. A rescue session should render as cheaply
    # as possible, especially if the reason for being here is a GPU problem.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        clickfinger_behavior = 1
    }
    accel_profile = flat
}

misc {
    # Required by the `fixlock` script: lets a fresh hyprlock take over a lock
    # whose client stopped responding, instead of leaving the session locked
    # until a reboot. Must stay set even in the rescue path.
    allow_session_lock_restore = true
}

$mainMod = SUPER

bind = $mainMod, return, exec, $terminal
bind = $mainMod, space, exec, $menu
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, L, exec, hyprlock

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Brightness and volume, so a rescue session is not stuck at whatever the
# panel and sink happened to be set to.
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# No bar, no wallpaper daemon, no clipboard watchers. Start them by hand if a
# repair session needs them:
#     waybar & hyprpaper &
