# Flags for /usr/bin/google-chrome-stable, which greps this file and passes
# every non-comment line to /opt/google/chrome/google-chrome. One flag per
# line; the launcher word-splits on whitespace, so no quoting or inline
# comments after a flag.
#
# Chrome is Chromium, not Electron, so it ignores the
# ELECTRON_OZONE_PLATFORM_HINT set in hyprland.lua that made Discord and VS
# Code render natively. Without this it runs on Xwayland, where the compositor
# can only bitmap-upscale it to the 1.5 monitor scale -- correct size, soft
# text. "auto" picks Wayland when a Wayland display exists and falls back to
# X11 otherwise, so it stays safe outside Hyprland.
--ozone-platform-hint=auto
