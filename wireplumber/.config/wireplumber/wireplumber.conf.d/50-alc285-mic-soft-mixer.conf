# Keep WirePlumber's hands off the ALC285's analog capture gain.
#
# By default WirePlumber drives the hardware "Capture" control to implement volume
# changes, which resets the tuned analog gain staging to maximum (clipping the mic)
# on any route re-apply -- plugging in headphones, connecting a Bluetooth headset,
# or an app adjusting the input volume.
#
# soft-mixer makes WirePlumber do volume in software instead, leaving the analog
# stages exactly where ~/.local/bin/fix-mic-gain sets them.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.pci-0000_04_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
