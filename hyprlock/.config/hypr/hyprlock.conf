# FALLBACK LOCKER. The real lock screen is the Quickshell surface (Lock.qml,
# creature-shell handoff turn 13a); hypridle and SUPER+L both run
# `qs ipc call lock lock || hyprlock`, so this config is only reached when
# the shell is not running. It is deliberately the plain, proven layout from
# before the creature-shell rework -- a fallback locker should be boring.
# (A full 13a rebuild in hyprlock was tried and abandoned: hyprlock lays out
# in physical pixels and its async text pipeline silently dropped most of
# the labels. See Lock.qml.)
#
# skin.conf is generated by `skinctl` from ~/.config/skins/skins.toml. It
# defines both the design tokens (bg, outer, inner, accent, ...) and the
# legacy Ember names this file still uses, so switching skins changes the
# lock screen without touching anything below.
#
# hyprlock reads its config at startup, so a skin change applies at the next
# lock, not immediately.

source = $HOME/.config/hypr/skin.conf

# $accent already exists in skin.conf as a design token, and it is not the
# same colour as $ember: the token set separates the frame rule (outer, which
# is Ember's red) from the thing that fills meters and marks selection
# (accent, which is Ember's amber). The lock screen wants the frame colour, so
# it keeps taking $ember -- redefining rather than inheriting is deliberate.
$accent = $ember
$accentAlpha = $emberAlpha

# JetBrainsMono was the old value here and was never installed on this
# machine, so it silently fell back to whatever fontconfig picked -- which for
# a missing family is Noto Sans CJK, not a monospace face at all. Check with
# `fc-match <family>` before putting a font name in any config on this box.
$font = CozetteVector

# GENERAL
general {
    # disable_loading_bar was removed in hyprlock 0.9.x and now logs a config
    # error on every lock.
    hide_cursor = true
}

# BACKGROUND
#
# The blur is down from 2 passes to 1: at 2 the wallpaper's sun turned into an
# undifferentiated smear, and the sun is the thing the whole palette is built
# on. Set back to 2 to hide the desktop more thoroughly.
background {
    monitor =
    path = ~/wallpaper/wallpaper.png
    blur_passes = 1
    color = $base
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $text
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $ember
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# USER AVATAR
#
# rounding = 0 makes this a square rather than a circle, to match the square
# corners the compositor and the bar now use.
image {
    monitor =
    path = ~/.face
    size = 100
    border_size = 4
    border_color = $accent
    rounding = 0

    position = 0, 75
    halign = center
    valign = center
}

# INPUT FIELD
#
# Square and thick-walled for the same reason: outline_thickness 6 and
# rounding 0. dots_size is up so the password dots read as blocks.
input-field {
    monitor =
    size = 340, 66
    outline_thickness = 6
    rounding = 0
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = 󰌾  $USER
    hide_input = false
    check_color = $ember2
    fail_color = $ember3
    fail_text = <i>$FAIL</i>
    capslock_color = $amber
    position = 0, -35
    halign = center
    valign = center
}
