<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  noto-fonts-cjk ships five regional cuts of one font (SC, TC, HK, JP, KR).
  The stock 65-nonlatin.conf lists only the KR cut, so before this file every
  Han character on the machine rendered in Korean forms:

      fc-match sans:lang=zh-cn
      NotoSansCJK-Regular.ttc: "Noto Sans CJK KR" "Regular"

  Two rules. First, text tagged Japanese gets the JP cut ahead of everything
  else, so kana and kanji in a ja-tagged run keep Japanese forms. Second, the
  generic families get an explicit fallback order for untagged text, which is
  all of it under LANG=en_US: the Latin face that already answers the generic
  today comes first, then the SC cut. The Latin face has to be named, because
  50-user.conf pulls this directory in at position 50, before 60-latin.conf,
  and a bare CJK prepend would put Noto ahead of DejaVu for Latin text too.

  No binding="strong": a face asked for by name (IBM Plex Mono) still wins;
  only the per-glyph fallback behind it moves. Needs a cache rebuild:

      fc-cache -f
      fc-match sans:lang=ja                  Noto Sans CJK JP
      fc-match sans:lang=zh-cn               Noto Sans CJK SC
      fc-match sans                          DejaVu Sans, unchanged
      fc-match "IBM Plex Mono:charset=4e2d"  Noto Sans Mono CJK SC

  The last one is kitty's path: IBM Plex Mono has no Han glyphs, so kitty asks
  fontconfig for a face that covers U+4E2D and takes what it is given.

  (XML comments cannot contain two consecutive hyphens, hence the wording.)
-->

<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Mono CJK JP</string></edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
