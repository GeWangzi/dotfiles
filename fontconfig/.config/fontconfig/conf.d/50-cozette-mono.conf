<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  CozetteVector.ttf ships without a spacing property:

      fc-query -f "%{family} spacing=%{spacing}\n" /usr/share/fonts/TTF/CozetteVector.ttf
      CozetteVector spacing=

  Every glyph in it is the same width, since it is a terminal font, but
  nothing in the file says so and fontconfig will not infer it. hyprlock does
  not care and renders in Cozette regardless. kitty does care: it
  asks fontconfig for a monospaced family, CozetteVector does not qualify, and
  fontconfig answers with a substitute. The substitute is Noto Sans CJK, kitty
  sizes its cell grid from that proportional face, and the terminal comes out
  wide and airy with visible gaps between characters.

  spacing=100 is FC_MONO. target="scan" applies the edit as the font file is
  scanned into the cache, which is the only target that can set this, so a
  cache rebuild is required after changing this file:

      fc-cache -f

  Delete this file and rebuild the cache to undo.

  Note for anyone editing the prose above: XML comments cannot contain two
  consecutive hyphens, which is why the wording here avoids the dashes used
  everywhere else in this repository.
-->

<fontconfig>
  <match target="scan">
    <test name="family">
      <string>CozetteVector</string>
    </test>
    <edit name="spacing">
      <int>100</int>
    </edit>
  </match>
</fontconfig>
