# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
#

font_family Caskaydia Cove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

background_opacity 0.9

# 16 was compensating by hand for the 157 DPI panel back when the Hyprland
# monitor scale was 1. The compositor now scales by 1.5, so 16 rendered as an
# effective 24. 16/1.5 = 10.67, so 11 restores the previous apparent size.
font_size 11
