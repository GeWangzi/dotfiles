# BEGIN_KITTY_THEME
# Ember
# skin.conf is generated by `skinctl` -- the 16-colour ANSI palette from the
# creature-shell handoff (turn 18b), rendered from the active skin. Swap this
# back to `include ember.conf` to pin the terminal to Ember and opt out of
# skin switching. skinctl reloads running kitties with SIGUSR1.
include skin.conf
# END_KITTY_THEME
#
# ember.conf comes from the `ember` stow package and is sampled from the
# wallpaper. The previous theme is still here as current-theme.conf
# (Catppuccin Mocha) -- swap the include line back to revert.

# The "Battle Terminal" handoff (Retro RPG launcher concepts #5) sets terminal
# body text in DejaVu Sans Mono and every label in Silkscreen.
#
# The label half was tried and reverted. kitty cannot switch face per prompt
# segment, but it can per SGR attribute, so `bold_font Silkscreen` put every
# bold run in Silkscreen -- which is what rpg-greet and rpg-spine.zsh emit
# their labels as. It needed a fontconfig rule to work at all, because kitty
# only accepts a bold_font fontconfig calls monospaced and Silkscreen declares
# no spacing; with that in place it did render.
#
# It looked wrong. Silkscreen is genuinely proportional -- five advance widths
# across ASCII, 0.375em to 0.875em -- so kitty scales anything wider than the
# 0.602em cell down to fit. M, N, W and % shrink visibly while narrow letters
# do not, and GENGAR comes out reading GEnGAR. A pixel face on a fixed grid is
# not the same face.
#
# So bold is left to DejaVu's own bold. The labels still read as labels, and
# the design's pixel type lives in the QML shell, which has real proportional
# layout and can use Silkscreen properly. To try the mapping again: add
# `bold_font Silkscreen`, restore
# fontconfig/.config/fontconfig/conf.d/51-silkscreen-mono.conf from git
# history, and run fc-cache -f.
#
# The previous body face was CozetteVector from the cozette-ttf package, a
# 6x13 bitmap grid traced into outlines. It is still installed and is still
# what waybar and wofi use. To revert: `font_family CozetteVector`.
#
# DejaVu's cell is 1.33x wider than Cozette's at the same size -- 11.33px
# against 8.50px, measured by dividing a real window's pixel width by the
# columns kitty reported. So font_size 13 in DejaVu is a third fewer columns
# than font_size 13 in Cozette was: a 1014px window went from 117 columns to
# 88, which is enough to collapse the greeting's two-column layout on a
# narrower window.
#
# 11 gives a 9.59px cell, so a 1014px window carries 104 columns -- most of the
# width back, at a size that still reads comfortably. On this panel (scale 1.5,
# device px = pt x 2) that renders at 22px.
#
# For reference on the same window: 10 gives 114 columns (an 8.72px cell, which
# is within a fifth of a pixel of Cozette's 8.50 and so matches the terminal's
# historical width almost exactly), 12 gives 95, 13 gives 88.
#
# The family name must be exact. kitty has no fallback list: an unknown family
# goes to fontconfig, which answers a miss with Noto Sans CJK, and kitty then
# sizes its cell grid from that proportional face -- a wide, airy, visibly
# non-monospaced terminal. That is the symptom to recognise if this renders
# wrong. Check with `fc-match "DejaVu Sans Mono"` before trusting it.
# Console redesign (2026-08-24): IBM Plex Mono, the face the whole shell now
# sets its labels and figures in, vendored in the `fonts` stow package. Its
# advance is 0.6em -- within a hair of DejaVu Sans Mono's 0.602 -- so the
# column arithmetic above still holds at the same size. To revert:
# `font_family DejaVu Sans Mono`.
font_family      IBM Plex Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11

background_opacity 0.9

# Chunky pass: a wide inner margin so the terminal reads as a slab rather than
# text pushed against a window edge.
window_padding_width 10

# The live prompt ends in the cursor rather than in a caret glyph. The block
# blinks at 0.55s on a hard steps(1) -- no fades or tweens anywhere in this
# system; kitty always animates the blink, so `linear` is as square as it
# gets, and 0 turns blinking off. The cursor COLOUR comes from skin.conf now
# (the accent -- Dream Land's gold), un-pinned with the Console redesign; the
# previous pinned lavender block (#F4EDFF on #0A0713) is in git history.
cursor_shape block
cursor_blink_interval 0.55 linear

# The window border colours in ember.conf only apply if kitty draws borders,
# which it does when more than one kitty window shares an OS window.
window_border_width 2px

# Tab bar as square blocks rather than the default powerline separators.
tab_bar_style separator
tab_separator " | "
