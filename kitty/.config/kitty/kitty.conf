# BEGIN_KITTY_THEME
# Skin
# skin.conf is generated by `skinctl` -- the 16-colour ANSI palette rendered
# from the active skin (Console mapping, 2026-08-24). skinctl reloads running
# kitties with SIGUSR1. The hand-maintained ember.conf and the Catppuccin
# current-theme.conf it replaced are both in git history.
include skin.conf
# END_KITTY_THEME

# IBM Plex Mono (Console redesign, 2026-08-24): the face the whole shell sets
# its labels and figures in, vendored in the `fonts` stow package.
#
# The family name must be exact. kitty has no fallback list: an unknown family
# goes to fontconfig, which answers a miss with Noto Sans CJK, and kitty then
# sizes its cell grid from that proportional face -- a wide, airy, visibly
# non-monospaced terminal. That is the symptom to recognise if this renders
# wrong. Check with `fc-match "IBM Plex Mono"` before trusting it.
#
# Size: the advance is 0.6em, so at 11 a 1014px window carries ~104 columns
# (on this panel, scale 1.5, that renders at 22px). 10 gives 114 columns, 12
# gives 95, 13 gives 88. The creature-era font history (DejaVu Sans Mono,
# CozetteVector, the Silkscreen bold experiment) is in git history.
font_family      IBM Plex Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11

background_opacity 0.9

# Chunky pass: a wide inner margin so the terminal reads as a slab rather than
# text pushed against a window edge.
window_padding_width 10

# The live prompt ends in the cursor rather than in a caret glyph. The block
# blinks at 0.55s on a hard steps(1) -- no fades or tweens anywhere in this
# system; kitty always animates the blink, so `linear` is as square as it
# gets, and 0 turns blinking off. The cursor COLOUR comes from skin.conf now
# (the accent -- Dream Land's gold), un-pinned with the Console redesign; the
# previous pinned lavender block (#F4EDFF on #0A0713) is in git history.
cursor_shape block
cursor_blink_interval 0.55 linear

# The window border colours in skin.conf only apply if kitty draws borders,
# which it does when more than one kitty window shares an OS window.
window_border_width 2px

# Tab bar as square blocks rather than the default powerline separators.
tab_bar_style separator
tab_separator " | "
