# BEGIN_KITTY_THEME
# Ember
# skin.conf is generated by `skinctl` -- the 16-colour ANSI palette from the
# creature-shell handoff (turn 18b), rendered from the active skin. Swap this
# back to `include ember.conf` to pin the terminal to Ember and opt out of
# skin switching. skinctl reloads running kitties with SIGUSR1.
include skin.conf
# END_KITTY_THEME
#
# ember.conf comes from the `ember` stow package and is sampled from the
# wallpaper. The previous theme is still here as current-theme.conf
# (Catppuccin Mocha) -- swap the include line back to revert.

# From the cozette-ttf package. Cozette is drawn as a bitmap font on a 6x13
# pixel grid; CozetteVector is that pixel art traced into outlines, so it
# scales and antialiases like any other TTF while still looking like pixels.
# The true bitmap builds (cozette-otb, psf-cozette) are deliberately not used
# here -- this panel runs at scale 1.5, and 13 x 1.5 = 19.5 device pixels,
# which a bitmap face cannot render.
#
# The family name must be exactly CozetteVector. kitty has no fallback list:
# an unknown family goes to fontconfig, which answers a missing family with
# Noto Sans CJK, and kitty then sizes its cell grid from that proportional
# face -- a wide, airy, visibly non-monospaced terminal. That is the symptom
# to recognise if this ever renders wrong.
#
# Revert to `font_family Caskaydia Cove Nerd Font` with font_size 11.
font_family CozetteVector
bold_font        auto
italic_font      auto
bold_italic_font auto

background_opacity 0.9

# 16 was compensating by hand for the 157 DPI panel back when the Hyprland
# monitor scale was 1. The compositor now scales by 1.5, so 16 rendered as an
# effective 24. 16/1.5 = 10.67, so 11 restores the previous apparent size.
#
# 13 rather than the 11 CaskaydiaCove used, and the exact value matters:
# device pixels = pt x 96/72 x monitor scale = pt x 96/72 x 1.5 = pt x 2 on
# this panel, so 13 renders at 26px -- exactly twice Cozette's 13px design
# grid, i.e. every source pixel becomes a clean 2x2 block. Sizes that are not
# a whole multiple of 13 device pixels land glyph edges between pixels and
# come out grey-fringed and soft. The next crisp sizes are 6.5 (1x) and
# 19.5 (3x).
font_size 13

# Chunky pass: a wide inner margin so the terminal reads as a slab rather than
# text pushed against a window edge, and a block cursor that does not blink.
window_padding_width 10
cursor_shape block
cursor_blink_interval 0

# The window border colours in ember.conf only apply if kitty draws borders,
# which it does when more than one kitty window shares an OS window.
window_border_width 2px

# Tab bar as square blocks rather than the default powerline separators.
tab_bar_style separator
tab_separator " | "
